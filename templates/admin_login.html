<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Admin - Kirish</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-sm w-full border-t-4 border-blue-500">
        <div class="text-center mb-6">
            <span class="text-4xl">👨‍💼</span>
            <h2 class="text-2xl font-bold mt-2">Umumiy Nazorat</h2>
            <p class="text-gray-500 text-sm">Direktorata uchun yopiq portal</p>
        </div>
        
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Parol kiriting:</label>
                <input type="password" name="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Parolni kiriting">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition">Kirish</button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="/" class="text-sm text-blue-500 hover:underline">Orqaga qaytish</a>
        </div>
    </div>
</body>
</html>
